[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "1.0.0"
description = "Production-grade banking fraud detection pipeline with PySpark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark==3.5.1",
    "delta-spark==3.1.0",
    "pyyaml==6.0.1",
    "psycopg2-binary==2.9.9",
    "faker==24.0.0",
    "python-dotenv==1.0.1",
    "structlog==24.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.1.1", "pytest-spark==0.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
