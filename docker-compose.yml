version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: fraud-postgres
    environment:
      POSTGRES_DB: fraud_analytics
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fraud-spark
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPARK_MASTER: local[*]
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: fraud_analytics
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_pass
      RAW_DATA_PATH: /app/data/raw/transactions
      DELTA_BRONZE_PATH: /app/data/delta/bronze/transactions
      DELTA_SILVER_PATH: /app/data/delta/silver/transactions
      DELTA_GOLD_PATH: /app/data/delta/gold
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./src:/app/src
    command: >
      bash -c "python -m fraud_detection.data_generation.generator &&
               python -m fraud_detection.etl.pipeline --full-refresh"

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: fraud-airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fraud_user:fraud_pass@postgres:5432/fraud_analytics
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-dGFqX2Zyb2lkX2tleV8zMnhieXRlcw==}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: airflow db init
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/app/src
      - ./config:/app/config

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: fraud-airflow-web
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fraud_user:fraud_pass@postgres:5432/fraud_analytics
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-dGFqX2Zyb2lkX2tleV8zMnhieXRlcw==}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: fraud_analytics
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_pass
    depends_on:
      - airflow-init
    ports:
      - "8080:8080"
    command: airflow webserver
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/app/src
      - ./config:/app/config
      - ./data:/app/data

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: fraud-airflow-scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fraud_user:fraud_pass@postgres:5432/fraud_analytics
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-dGFqX2Zyb2lkX2tleV8zMnhieXRlcw==}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: fraud_analytics
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_pass
    depends_on:
      - airflow-init
    command: airflow scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/app/src
      - ./config:/app/config
      - ./data:/app/data

volumes:
  postgres_data:
